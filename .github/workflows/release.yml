name: Release
on:
  push:
    tags:
      - 'v*'

# If the same tag gets pushed again while a previous run for it is still in
# flight (e.g. you delete+re-push a tag to redo a release), cancel the old
# run instead of letting two runs race each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reads the version out of the pushed tag (v0.4.0 -> 0.4.0) and writes it
  # into package.json, src-tauri/tauri.conf.json, and src-tauri/Cargo.toml,
  # then regenerates package-lock.json from the corrected package.json (never
  # hand-edit the lockfile directly - npm derives it). Commits the result to
  # main so the three files can never drift out of sync with a release again.
  #
  # Note: the tag itself still points at whichever commit you tagged locally
  # - this job adds ONE more commit on top of main with the version bump.
  # That's expected and harmless: the build-and-upload job below checks out
  # this job's commit SHA (not the raw tag), so the actual built app and
  # release artifacts always reflect the corrected version, even though the
  # tag ref and the version-bump commit aren't literally the same commit.
  sync-version:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump package.json
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Bump tauri.conf.json
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Bump Cargo.toml
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${{ steps.version.outputs.version }}\"/" src-tauri/Cargo.toml

      - name: Regenerate package-lock.json
        run: npm install

      - name: Commit version bump
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          if git diff --cached --quiet; then
            echo "No version changes needed - files already at ${{ steps.version.outputs.version }}"
          else
            git commit -m "chore: sync version to ${{ steps.version.outputs.version }} [skip ci]"
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Creates the draft release ONCE, on its own, before either platform starts
  # building. This is the fix for the duplicate-draft bug: previously both
  # matrix jobs below called tauri-action independently, and each one tried
  # to find-or-create a release for the tag at roughly the same time. Running
  # in parallel, both checks could see "no release yet" and both would create
  # one - a known race in tauri-action itself (see upstream issue #914,
  # "Duplicate Releases Sometimes Created"). Having exactly one job create
  # the release, and having the build jobs upload into it via releaseId
  # instead of tagName-based lookup, removes the race entirely.
  create-release:
    needs: sync-version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.ref_name }}',
              name: 'GW2 Wealth Tracker ${{ github.ref_name }}',
              body: 'Auto-update will pick this up. Edit these release notes before publishing — they show up in-app as the changelog.',
              draft: true,
              prerelease: false
            })
            return data.id

  build-and-upload:
    needs: [sync-version, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'
          - platform: 'windows-latest'
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout version-synced commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-version.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install npm dependencies
        run: npm install
      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # tagName is still needed even though releaseId identifies the release —
          # without it, latest.json's download URLs fall back to
          # releases/latest/download/<bundle> instead of this tag's assets.
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
